<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数取機（カウンター）</title>
    <link rel="icon" href="dango_1(default).png" type="image/png">
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding-bottom: 50px;
        }
        header {
            background-color: #50C878;
            color: white;
            padding: 30px 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            max-width: 90%;
            margin: 0 auto;
        }
        .main-title {
            font-size: 2.2rem;
            font-weight: bold;
            color: white;
            margin: 0;
        }
        .dango-icon {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background-color: white;
            border-radius: 50%;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header p {
            color: #ffffff;
            opacity: 0.9;
            margin-top: 10px;
            font-size: 1rem;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 3px 6px 0 #ccc;
            max-width: 400px;
            width: 90%;
            margin: 0 auto;
            text-align: center;
        }
        .counter-display {
            font-size: 96px;
            font-weight: bold;
            color: #28a745;
            margin: 10px 0 25px 0;
            font-family: monospace;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            border: 2px solid #eee;
            min-height: 110px;
            line-height: 110px;
        }
        .control-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .btn-count {
            flex: 1;
            padding: 15px 0;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 48px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
            user-select: none;
        }
        .btn-plus {
            background-color: #28a745;
            box-shadow: 0 8px 0 #1e7e34;
        }
        .btn-plus:active {
            box-shadow: none;
            transform: translateY(8px);
        }
        .btn-minus {
            background-color: #dc3545;
            box-shadow: 0 8px 0 #bd2130;
        }
        .btn-minus:active {
            box-shadow: none;
            transform: translateY(8px);
        }
        .btn-reset {
            width: 100%;
            padding: 12px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #495057;
            transition: 0.1s;
        }
        .btn-reset:active {
            box-shadow: none;
            transform: translateY(4px);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #666;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .back-link:hover {
            color: #50C878;
        }
        @media (max-width: 600px) {
            .title-container {
                flex-direction: column;
                gap: 10px;
            }
            .main-title {
                font-size: 1.6rem;
            }
            .dango-icon {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="title-container">
        <img src="dango_1(default).png" alt="ダンゴムシ（普通）" class="dango-icon">
        <h1 class="main-title">数取機（カウンター）</h1>
        <img src="dango_2(smile).png" alt="ダンゴムシ（にっこり）" class="dango-icon">
    </div>
    <p>大きなボタンで快適に数を記録できるシンプルな数取機です。</p>
</header>

<div class="container">
    <div class="counter-display" id="counterNum">0</div>
    
    <div class="control-buttons">
        <button class="btn-count btn-minus" onclick="countDown()">-</button>
        <button class="btn-count btn-plus" onclick="countUp()">+</button>
    </div>

    <button class="btn-reset" onclick="countReset()">数値をリセット</button>
    
    <a href="index.html" class="back-link">← ホームに戻る</a>
</div>

<script>
    let count = parseInt(localStorage.getItem('counter_val')) || 0;
    document.getElementById('counterNum').innerText = count;

    function countUp() {
        count++;
        updateDisplay();
    }

    function countDown() {
        if (count > 0) {
            count--;
            updateDisplay();
        }
    }

    function countReset() {
        if (confirm("カウントをリセットしますか？")) {
            count = 0;
            updateDisplay();
        }
    }

    function updateDisplay() {
        document.getElementById('counterNum').innerText = count;
        localStorage.setItem('counter_val', count);
    }
</script>
</body>
</html>
