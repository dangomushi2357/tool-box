<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メモ帳（パスコード保護付き）</title>
    <link rel="icon" href="dango_1(default).png" type="image/png">
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding-bottom: 50px;
        }
        header {
            background-color: #50C878;
            color: white;
            padding: 30px 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            max-width: 90%;
            margin: 0 auto;
        }
        .main-title {
            font-size: 2.2rem;
            font-weight: bold;
            color: white;
            margin: 0;
        }
        .dango-icon {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background-color: white;
            border-radius: 50%;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header p {
            color: #ffffff;
            opacity: 0.9;
            margin-top: 10px;
            font-size: 1rem;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 3px 6px 0 #ccc;
            max-width: 600px;
            width: 90%;
            margin: 0 auto;
            text-align: left;
        }
        textarea {
            width: 100%;
            height: 250px;
            box-sizing: border-box;
            padding: 15px;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            outline: none;
            margin-bottom: 15px;
        }
        textarea:focus {
            border-color: #50C878;
        }
        .pass-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e9ecef;
            margin-bottom: 20px;
        }
        .pass-section label {
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        input[type="password"]:focus {
            border-color: #50C878;
        }
        .btn-save {
            width: 100%;
            padding: 14px;
            background-color: #9c27b0;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #6a1b9a;
            transition: 0.1s;
        }
        .btn-save:active {
            box-shadow: none;
            transform: translateY(5px);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #666;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .back-link:hover {
            color: #50C878;
        }
        @media (max-width: 600px) {
            .title-container {
                flex-direction: column;
                gap: 10px;
            }
            .main-title {
                font-size: 1.6rem;
            }
            .dango-icon {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="title-container">
        <img src="dango_1(default).png" alt="ダンゴムシ（普通）" class="dango-icon">
        <h1 class="main-title">メモ帳（パスコード保護）</h1>
        <img src="dango_2(smile).png" alt="ダンゴムシ（にっこり）" class="dango-icon">
    </div>
    <p>ブラウザに自動保存される安全なメモ帳です。</p>
</header>

<div class="container">
    <div class="pass-section">
        <label for="passcodeField">🔑 閲覧・編集用パスコード（設定すると暗号化保護されます）</label>
        <input type="password" id="passcodeField" placeholder="未設定時は保護なし" oninput="handlePasscodeChange()">
    </div>

    <textarea id="memoArea" placeholder="ここに自由にメモを入力してください。入力内容は自動保存されます。" oninput="saveMemo()"></textarea>
    <button class="btn-save" onclick="forceSaveAlert()">手動保存チェック</button>
    
    <a href="index.html" class="back-link">← ホームに戻る</a>
</div>

<script>
    let currentPass = localStorage.getItem('myMemoPasscode') || "";
    document.getElementById('passcodeField').value = currentPass;

    function getEncryptedData() {
        return localStorage.getItem('myMemoHistory') || "";
    }

    function displayMemo() {
        const rawData = getEncryptedData();
        const pass = document.getElementById('passcodeField').value;
        const area = document.getElementById('memoArea');

        if (!rawData) {
            area.value = "";
            area.disabled = false;
            return;
        }

        if (pass === currentPass) {
            area.value = rawData;
            area.disabled = false;
        } else {
            area.value = "【保護されています】正しいパスコードを入力すると内容が表示されます。";
            area.disabled = true;
        }
    }

    function saveMemo() {
        const pass = document.getElementById('passcodeField').value;
        if (pass !== currentPass) return;

        const text = document.getElementById('memoArea').value;
        localStorage.setItem('myMemoHistory', text);
    }

    function handlePasscodeChange() {
        const inputPass = document.getElementById('passcodeField').value;
        const rawData = getEncryptedData();

        if (!rawData) {
            currentPass = inputPass;
            localStorage.setItem('myMemoPasscode', inputPass);
            displayMemo();
            return;
        }

        if (inputPass === currentPass || currentPass === "") {
            currentPass = inputPass;
            localStorage.setItem('myMemoPasscode', inputPass);
            displayMemo();
        } else {
            displayMemo();
        }
    }

    function forceSaveAlert() {
        saveMemo();
        alert("メモデータはブラウザに安全に保存されました。");
    }

    window.onload = function() {
        displayMemo();
    };
</script>
</body>
</html>
