<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クリックゲーム</title>
    <link rel="icon" href="dango_1(default).png" type="image/png">
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding-bottom: 50px;
        }
        header {
            background-color: #50C878;
            color: white;
            padding: 30px 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            max-width: 90%;
            margin: 0 auto;
        }
        .main-title {
            font-size: 2.2rem;
            font-weight: bold;
            color: white;
            margin: 0;
        }
        .dango-icon {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background-color: white;
            border-radius: 50%;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header p {
            color: #ffffff;
            opacity: 0.9;
            margin-top: 10px;
            font-size: 1rem;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 3px 6px 0 #ccc;
            max-width: 400px;
            width: 90%;
            margin: 0 auto;
            text-align: center;
        }
        .score-display {
            font-size: 64px;
            font-weight: bold;
            color: #007bff;
            margin: 20px 0;
            font-family: monospace;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
            border: 2px solid #eee;
        }
        .btn-main {
            width: 100%;
            padding: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 0 #0056b3;
            transition: 0.1s;
            margin-bottom: 20px;
            user-select: none;
        }
        .btn-main:active {
            box-shadow: none;
            transform: translateY(8px);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #666;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .back-link:hover {
            color: #50C878;
        }
        @media (max-width: 600px) {
            .title-container {
                flex-direction: column;
                gap: 10px;
            }
            .main-title {
                font-size: 1.6rem;
            }
            .dango-icon {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="title-container">
        <img src="dango_1(default).png" alt="ダンゴムシ（普通）" class="dango-icon">
        <h1 class="main-title">クリックゲーム</h1>
        <img src="dango_2(smile).png" alt="ダンゴムシ（にっこり）" class="dango-icon">
    </div>
    <p>ボタンをクリックしてスコアを伸ばすミニゲームです。</p>
</header>

<div class="container">
    <div class="score-display" id="scoreNum">0</div>
    <button class="btn-main" onclick="clickGameMain()">クリック！</button>
    <a href="index.html" class="back-link">← ホームに戻る</a>
</div>

<script>
    let clickCount = parseInt(localStorage.getItem('myClickCount')) || 0;
    document.getElementById('scoreNum').innerText = clickCount;

    function clickGameMain() {
        clickCount++;
        document.getElementById('scoreNum').innerText = clickCount;
        localStorage.setItem('myClickCount', clickCount);
    }
</script>
</body>
</html>
