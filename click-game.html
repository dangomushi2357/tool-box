<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クリックゲーム</title>
    <link rel="icon" href="dango_1(default).png" type="image/png">
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding-bottom: 50px;
        }
        header {
            background-color: #50C878;
            color: white;
            padding: 30px 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            max-width: 90%;
            margin: 0 auto;
        }
        .main-title {
            font-size: 2.2rem;
            font-weight: bold;
            color: white;
            margin: 0;
        }
        .dango-icon {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background-color: white;
            border-radius: 50%;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header p {
            color: #ffffff;
            opacity: 0.9;
            margin-top: 10px;
            font-size: 1rem;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 3px 6px 0 #ccc;
            max-width: 450px;
            width: 90%;
            margin: 0 auto;
            text-align: center;
        }
        .score-display {
            font-size: 48px;
            font-weight: bold;
            color: #007bff;
            margin: 15px 0;
            font-family: monospace;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
            border: 2px solid #eee;
        }
        .streak-display {
            font-size: 18px;
            color: #ffc107;
            font-weight: bold;
            background: #343a40;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .btn-main {
            width: 100%;
            padding: 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 0 #0056b3;
            transition: 0.1s;
            margin-bottom: 20px;
            user-select: none;
        }
        .btn-main:active {
            box-shadow: none;
            transform: translateY(8px);
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
            text-align: left;
            font-size: 14px;
        }
        .info-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #666;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .back-link:hover {
            color: #50C878;
        }
        @media (max-width: 600px) {
            .title-container {
                flex-direction: column;
                gap: 10px;
            }
            .main-title {
                font-size: 1.6rem;
            }
            .dango-icon {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="title-container">
        <img src="dango_1(default).png" alt="ダンゴムシ（普通）" class="dango-icon">
        <h1 class="main-title">クリックゲーム</h1>
        <img src="dango_2(smile).png" alt="ダンゴムシ（にっこり）" class="dango-icon">
    </div>
    <p>ボタンをクリックしてスコアを伸ばすミニゲームです。</p>
</header>

<div class="container">
    <div id="streakBadge" class="streak-display">🔥 1 連撃目</div>
    <div class="score-display" id="scoreNum">0</div>
    
    <button class="btn-main" onclick="clickGameMain()">クリック！</button>

    <div class="info-grid">
        <div class="info-item">📅 最終プレイ: <span id="lastPlayDate">-</span></div>
        <div class="info-item">⏱️ 本日セッション: <span id="sessionCount">0</span> 回</div>
    </div>

    <a href="index.html" class="back-link">← ホームに戻る</a>
</div>

<script>
    let clickCount = parseInt(localStorage.getItem('myClickCount')) || 0;
    let todaySession = parseInt(localStorage.getItem('todaySessionCount')) || 0;
    let lastPlay = localStorage.getItem('last_play_date') || "未プレイ";
    let streak = parseInt(localStorage.getItem('click_streak')) || 1;

    document.getElementById('scoreNum').innerText = clickCount;
    document.getElementById('sessionCount').innerText = todaySession;
    document.getElementById('lastPlayDate').innerText = lastPlay;
    document.getElementById('streakBadge').innerText = `🔥 ${streak} 連撃目`;

    function clickGameMain() {
        clickCount += streak;
        streak++;
        
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getUTCDate()).padStart(2, '0');
        const todayStr = `${yyyy}/${mm}/${dd}`;

        if(lastPlay !== todayStr) {
            todaySession++;
            lastPlay = todayStr;
        }

        updateGameDisplay();
        saveGameHistory();
    }

    function updateGameDisplay() {
        document.getElementById('scoreNum').innerText = clickCount;
        document.getElementById('sessionCount').innerText = todaySession;
        document.getElementById('lastPlayDate').innerText = lastPlay;
        document.getElementById('streakBadge').innerText = `🔥 ${streak} 連撃目`;
    }

    function saveGameHistory() {
        localStorage.setItem('myClickCount', clickCount);
        localStorage.setItem('todaySessionCount', todaySession);
        localStorage.setItem('last_play_date', lastPlay);
        localStorage.setItem('click_streak', streak);

        let history = JSON.parse(localStorage.getItem('click_history')) || [];
        history.push({
            timestamp: new Date().getTime(),
            current_score: clickCount
        });
        if(history.length > 50) {
            history.shift();
        }
        localStorage.setItem('click_history', JSON.stringify(history));
    }
</script>
</body>
</html>
