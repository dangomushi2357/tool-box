<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>クリックゲーム - v5.2.3</title>
    <link rel="icon" href="dango_1(default).png" type="image/png">
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f4f8;
            transition: background 0.5s;
            margin: 0;
            padding-bottom: 50px;
        }
        header {
            background-color: #50C878;
            color: white;
            padding: 30px 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            max-width: 90%;
            margin: 0 auto;
        }
        .main-title {
            font-size: 2.2rem;
            font-weight: bold;
            color: white;
            margin: 0;
        }
        .dango-icon {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background-color: white;
            border-radius: 50%;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header p {
            color: #ffffff;
            opacity: 0.9;
            margin-top: 10px;
            font-size: 1rem;
        }
        .container {
            position: relative;
            text-align: center;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
        }
        .emerald-button {
            display: inline-block;
            background-color: #50C878;
            color: white;
            padding: 25px 50px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 24px;
            box-shadow: 3px 5px 0 #3a965a;
            cursor: pointer;
            border: none;
            transition: 0.1s;
            user-select: none;
            margin: 20px 0;
        }
        .emerald-button:active {
            box-shadow: none;
            transform: translate(4px, 6px);
        }
        .display-container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        .counter-display {
            font-family: 'Arial Black', sans-serif;
            font-size: 48px;
            color: black;
            line-height: 1;
            margin-bottom: 15px;
        }
        .today-display {
            font-family: 'Arial Black', sans-serif;
            font-size: 32px;
            color: #50C878;
        }
        #special-msg {
            height: 30px;
            color: #ff5722;
            font-weight: bold;
            font-size: 18px;
            margin-top: 10px;
        }
        .stats-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }
        #graph-container {
            display: flex;
            align-items: flex-end;
            height: 120px;
            gap: 12px;
            border-bottom: 2px solid #333;
            padding: 10px 20px;
            justify-content: center;
            overflow-x: auto;
        }
        .graph-bar {
            cursor: pointer;
            transition: opacity 0.2s, height 0.1s ease-out, background-color 0.3s;
        }
        .custom-tooltip {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            pointer-events: none;
            display: none;
            z-index: 1000;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .history-table th, .history-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        .history-table th { background-color: #f2f2f2; }
        .details-container { margin-top: 20px; }
        .notice-msg {
            font-size: 12px;
            color: #666;
            background-color: #eef2f5;
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
            margin: 10px 0;
        }
        .small-btn {
            padding: 8px 15px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            margin: 0 5px;
            color: white;
        }
        .reset-btn { background-color: red; }
        .home-btn { background-color: #6c757d; }
        .dl-btn { background-color: #2196F3; font-weight: bold; margin-top: 5px; padding: 10px 20px; }
        @keyframes rainbow-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .rainbow-active {
            background: linear-gradient(124deg, #ff2400, #e81d1d, #e8b71d, #e3e81d, #1de840, #1ddde8, #2b1de8, #dd00f3, #dd00f3);
            background-size: 1800% 1800%;
            animation: rainbow-bg 18s ease infinite;
        }
        #secret-btn {
            display: none;
            position: absolute;
            right: 10px; 
            bottom: 10px; 
            width: 50px;
            height: 50px;
            background-image: url('dango_1(default).png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            border: none; 
            color: transparent; 
            cursor: pointer;
            z-index: 10;
            transition: transform 0.1s;
        }
        #secret-btn:active {
            transform: scale(0.9);
        }

        @media (max-width: 600px) {
            .title-container {
                flex-direction: column;
                gap: 10px;
            }
            .main-title {
                font-size: 1.6rem;
            }
            .dango-icon {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="title-container">
        <img src="dango_1(default).png" alt="ダンゴムシ（普通）" class="dango-icon">
        <h1 class="main-title">クリックゲーム</h1>
        <img src="dango_2(smile).png" alt="ダンゴムシ（にっこり）" class="dango-icon">
    </div>
    <p>1日100回クリックすると、連続記録が更新されます。</p>
</header>

<div class="container">
    <div style="margin-bottom: 20px;">
        <button class="small-btn reset-btn" onclick="resetCount()">リセット</button>
        <button class="small-btn home-btn" onclick="goHome()">ホームに戻る</button>
    </div>
    <div class="display-container">
        <div class="label">累計クリック</div>
        <div id="count-num" class="counter-display">0</div>
        <div class="label">今日のクリック</div>
        <div id="today-num" class="today-display">0</div>
    </div>
    <button type="button" class="emerald-button" onclick="countUp()">押す</button>
    <div id="special-msg"></div>
    <div class="stats-box">
        <h3>🔥 連続記録: <span id="streak-count">0</span>日</h3>
        <div id="graph-container"></div>
        <p style="font-size: 12px;">直近7日間の最高スコア</p>    </div>
    <div class="details-container">
        <details>
            <summary style="cursor: pointer; color: #50C878; font-weight: bold; margin-bottom:10px;">📊 全履歴を表示</summary>
            <p>履歴は1年ごとにリセットされます。保存したい場合は下のボタンを押してください</p>
            
            <div class="notice-msg">
                <p style="margin:0;">履歴の反映に時間がかかる場合があります。ページを再読み込みしてみてください。</p>
            </div>
            <br>
            
            <button class="small-btn dl-btn" onclick="downloadCSV()">履歴をCSVで保存する</button>
            <div id="full-history-list"></div>
        </details>
    </div>
    <br>
    <button id="rainbow-toggle-btn" class="small-btn home-btn" style="display:none;" onclick="toggleRainbow()">🌈 背景の虹色をON/OFFする</button>
    <button id="secret-btn" onclick="secretPower()"></button>
</div>
<div id="tooltip" class="custom-tooltip"></div>

<script>
    let count = 0;
    let todaySessionCount = 0; 

    window.onload = function() {
        let savedCount = localStorage.getItem('myClickCount');
        count = savedCount ? parseInt(savedCount) : 0;

        initStats();
        updateDisplay();
    };

    function countUp() {
        const todayStr = new Date().toLocaleDateString();
        
        count = count + 1; 
        todaySessionCount = todaySessionCount + 1; 
        
        localStorage.setItem('myClickCount', count);
        localStorage.setItem('todaySessionCount', todaySessionCount);
        localStorage.setItem('last_play_date', todayStr);
        
        updateDisplay();

        saveScoreAndRefreshGraph(todaySessionCount);

        if (todaySessionCount === 100) {
            updateStreak();
        }
    }

    function resetCount() {
        if (confirm("リセットしますか？")) {
            localStorage.clear();
            location.reload();
        }
    }

    function updateDisplay() {
        const numDisplay = document.getElementById('count-num');
        const todayDisplay = document.getElementById('today-num');
        const msgArea = document.getElementById('special-msg');
        const secretBtn = document.getElementById('secret-btn');
        const toggleBtn = document.getElementById('rainbow-toggle-btn');
        numDisplay.innerHTML = count;
        todayDisplay.innerHTML = todaySessionCount;
        if (count >= 1000000) {
            msgArea.innerHTML = "1000000回達成！ゲームクリア！\nこの後もクリックした回数は増え続けます。";
            numDisplay.style.color = "gold";
            document.body.classList.add('rainbow-active');
            toggleBtn.style.display = "inline-block";
        } else if (count >= 100000) {
            msgArea.innerHTML = "100000回達成！";
            numDisplay.style.color = "blue";
        } else if (count >= 10000) {
            msgArea.innerHTML = "10000回達成！";
            numDisplay.style.color = "green";
            secretBtn.style.display = "block";
        } else if (count >= 1000) {
            msgArea.innerHTML = "1000回達成！";
            numDisplay.style.color = "yellow";
        } else if (count >= 100) {
            msgArea.innerHTML = "100回達成！";
            numDisplay.style.color = "orange";
        } else if (count >= 10) {
            msgArea.innerHTML = "10回達成！";
            numDisplay.style.color = "red";
        } 
    } 

    function secretPower() {
        alert("よく見つけましたね\n隠しボタンです");
    }

    let isKeyPressed = false;
    window.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            if (!isKeyPressed) {
                countUp();
                isKeyPressed = true;
            }
        }
    });
    window.addEventListener('keyup', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
            isKeyPressed = false;
        }
    });

    function toggleRainbow() { document.body.classList.toggle('rainbow-active'); }
    function goHome() { location.href = "index.html"; }

    function initStats() {
        const todayStr = new Date().toLocaleDateString();
        const lastDate = localStorage.getItem('last_play_date');
        let streak = parseInt(localStorage.getItem('click_streak') || "0");
        let savedTodayCount = localStorage.getItem('todaySessionCount');
        
        if (lastDate === todayStr) {
            todaySessionCount = savedTodayCount ? parseInt(savedTodayCount) : 0;
        } else {
            todaySessionCount = 0;
            localStorage.setItem('todaySessionCount', "0");
            
            if (lastDate) {
                const today = new Date();
                const last = new Date(lastDate);
                today.setHours(0, 0, 0, 0);
                last.setHours(0, 0, 0, 0);
                if ((today - last) / (1000 * 60 * 60 * 24) > 1) {
                    streak = 0;
                    localStorage.setItem('click_streak', "0");
                }
            }
        }
        document.getElementById('streak-count').innerText = streak;
        
        buildGraphFull();
    }

    function updateStreak() {
        let streak = parseInt(localStorage.getItem('click_streak') || "0");
        streak++;
        localStorage.setItem('click_streak', streak);
        document.getElementById('streak-count').innerText = streak;
        alert("100回達成！連続記録更新！");
        
        buildGraphFull();
    }

    function saveScoreAndRefreshGraph(score) {
        const todayStr = new Date().toLocaleDateString();
        let history = JSON.parse(localStorage.getItem('click_history') || "[]");
        const todayIdx = history.findIndex(i => i.date === todayStr);
        if (todayIdx > -1) {
            history[todayIdx].score = score;
        } else {
            history.push({ date: todayStr, score: score });
            buildGraphFull();
            return;
        }
        if (history.length > 365) history.shift();
        localStorage.setItem('click_history', JSON.stringify(history));

        let recentHistory = [...history].slice(-7);
        let maxScore = 100;
        recentHistory.forEach(data => { if (data.score > maxScore) maxScore = data.score; });

        // 1. グラフのニョキニョキ更新＆データ属性(dataset)のリアルタイム書き換え
        const todayBar = document.getElementById('bar-today');
        if (todayBar) {
            const barHeight = Math.min((score / maxScore) * 110, 110);
            todayBar.style.height = barHeight + 'px';
            if (score >= 100) {
                todayBar.style.backgroundColor = '#50C878';
            }
            
            // 🚀【重要：修正点】DOM内部に持っているスコアデータをその場で最新化！
            todayBar.dataset.score = score;

            // 🚀【重要：修正点】もしカーソルが今まさに「今日の棒」の上に乗っていた場合、
            // ポップアップ中のツールチップ文字自体も即座にアップデート！
            const tooltip = document.getElementById('tooltip');
            if (tooltip && tooltip.style.display === 'block') {
                tooltip.innerText = todayBar.dataset.date + ": " + score + "回";
            }
        }

        // 2. 全履歴テーブルの今日の行をその場で書き換え
        const todayTableScore = document.getElementById('table-today-score');
        if (todayTableScore) {
            todayTableScore.innerText = score + "回";
        }
    }

    function buildGraphFull() {
        const history = JSON.parse(localStorage.getItem('click_history') || "[]");
        const container = document.getElementById('graph-container');
        const historyList = document.getElementById('full-history-list');
        container.innerHTML = '';
        historyList.innerHTML = '';

        const todayStr = new Date().toLocaleDateString();
        let recentHistory = [...history].slice(-7);
        while (recentHistory.length < 7) {
            recentHistory.unshift({ date: "", score: -1 });
        }

        let maxScore = 100;
        recentHistory.forEach(data => { if (data.score > maxScore) maxScore = data.score; });

        const tooltip = document.getElementById('tooltip');

        recentHistory.forEach(data => {
            const column = document.createElement('div');
            column.style.cssText = "display:flex; flex-direction:column; align-items:center; gap:5px; width:40px;";
            if (data.score === -1) {
                container.appendChild(column);
                return;
            }

            const bar = document.createElement('div');
            const barHeight = Math.min((data.score / maxScore) * 110, 110);
            bar.style.cssText = `width:25px; height:${barHeight}px; border-radius:3px 3px 0 0;`;
            bar.style.backgroundColor = data.score >= 100 ? '#50C878' : '#ccc';
            bar.className = "graph-bar";
            
            if (data.date === todayStr) {
                bar.id = 'bar-today';
            }

            bar.dataset.date = data.date;
            bar.dataset.score = data.score;

            bar.onmouseover = (e) => {
                tooltip.innerText = bar.dataset.date + ": " + bar.dataset.score + "回";
                tooltip.style.display = 'block';
            };
            bar.onmousemove = (e) => {
                tooltip.style.left = (e.pageX + 15) + 'px';
                tooltip.style.top = (e.pageY + 15) + 'px';
            };
            bar.onmouseout = () => { tooltip.style.display = 'none'; };

            const dateText = document.createElement('div');
            dateText.innerText = data.date.split('/').slice(1).join('/');
            dateText.style.fontSize = '10px';
            
            column.appendChild(bar);
            column.appendChild(dateText);
            container.appendChild(column);
        });

        if (history.length > 0) {
            const table = document.createElement('table');
            table.className = "history-table";
            
            let tableRowsHtml = history.map(item => {
                if (item.date === todayStr) {
                    return `<tr><td>${item.date}</td><td id="table-today-score" style="font-weight:bold; color:#50C878;">${item.score}回</td></tr>`;
                }
                return `<tr><td>${item.date}</td><td>${item.score}回</td></tr>`;
            }).reverse().join('');

            table.innerHTML = `<thead><tr><th>日付</th><th>回数</th></tr></thead><tbody>${tableRowsHtml}</tbody>`;
            historyList.appendChild(table);
        }
    }

    function downloadCSV() {
        const history = JSON.parse(localStorage.getItem('click_history') || "[]");
        if (history.length === 0) {
            alert("保存する履歴がありません。");
            return;
        }
        let csvContent = "日付,クリック回数\n";
        history.forEach(item => { csvContent += item.date + "," + item.score + "\n"; });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "click_history_report.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
