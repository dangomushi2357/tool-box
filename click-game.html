<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クリックゲーム</title>
    <link rel="icon" href="dango_1(default).png" type="image/png">
    <style>
        body {
    font-family: sans-serif;
    background-color: #f0f0f0;
    color: #333;
    margin: 0;
    padding-bottom: 50px;
}
<header>
    <div class="title-container">
        <img src="dango_1(default).png" alt="ダンゴムシ（普通）" class="dango-icon">
        <h1 class="main-title">クリックゲーム</h1>
        <img src="dango_2(smile).png" alt="ダンゴムシ（にっこり）" class="dango-icon">
    </div>
    <p>ボタンをクリックしてスコアを伸ばすミニゲームです。</p>
</header>
.title-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    max-width: 90%;
    margin: 0 auto;
}
.main-title {
    font-size: 2.2rem;
    font-weight: bold;
    color: white;
    margin: 0;
}
.dango-icon {
    width: 100px;
    height: 100px;
    object-fit: contain;
    background-color: white;
    border-radius: 50%;
    padding: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
header p {
    color: #ffffff;
    opacity: 0.9;
    margin-top: 10px;
    font-size: 1rem;
}
@media (max-width: 600px) {
    .title-container {
        flex-direction: column;
        gap: 10px;
    }
    .main-title {
        font-size: 1.6rem;
    }
    .dango-icon {
        width: 80px;
        height: 80px;
    }
}

        /* === 2. 本体のオリジナルレイアウト（一切変えない！） === */
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 3px 6px 0 #ccc;
            max-width: 500px;
            width: 90%;
            margin: 0 auto;
            text-align: center;
        }
        .score-display {
            font-size: 48px;
            font-weight: bold;
            color: #007bff;
            margin: 15px 0;
            font-family: monospace;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
            border: 2px solid #eee;
        }
        .streak-display {
            font-size: 18px;
            color: #ffc107;
            font-weight: bold;
            background: #343a40;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .btn-main {
            width: 100%;
            padding: 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 0 #0056b3;
            transition: 0.1s;
            margin-bottom: 20px;
            user-select: none;
        }
        .btn-main:active {
            box-shadow: none;
            transform: translateY(8px);
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
            text-align: left;
            font-size: 14px;
        }
        .info-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        /* === 3. グラフ表示部分（バグ修正：右寄りの偏りを直して中央・均等配置へ） === */
        .graph-container {
            margin-top: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 1px solid #eee;
            text-align: left;
        }
        .graph-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
            color: #555;
        }
        .graph-wrap {
            display: flex;
            align-items: flex-end;
            justify-content: center; /* 均等・中央に寄せるように修正 */
            gap: 8px;                /* 7件でも偏らないように間隔を最適化 */
            height: 120px;
            padding-top: 20px;
            border-bottom: 2px solid #ccc;
        }
        .graph-bar {
            flex: 1;
            max-width: 35px;         /* 1本あたりの最大幅を固定して右寄りを防止 */
            background-color: #007bff;
            border-radius: 4px 4px 0 0;
            position: relative;
            transition: height 0.3s;
        }
        .graph-label {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: bold;
            color: #333;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #666;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .back-link:hover {
            color: #50C878;
        }

        @media (max-width: 600px) {
            .title-container {
                flex-direction: column;
                gap: 10px;
            }
            .main-title {
                font-size: 1.6rem;
            }
            .dango-icon {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="title-container">
        <img src="dango_1(default).png" alt="ダンゴムシ（普通）" class="dango-icon">
        <h1 class="main-title">クリックゲーム</h1>
        <img src="dango_2(smile).png" alt="ダンゴムシ（にっこり）" class="dango-icon">
    </div>
    <p>ボタンをクリックしてスコアを伸ばすミニゲームです。</p>
</header>

<div class="container">
    <div id="streakBadge" class="streak-display">🔥 1 連撃目</div>
    <div class="score-display" id="scoreNum">0</div>
    
    <button class="btn-main" onclick="clickGameMain()">クリック！</button>

    <div class="info-grid">
        <div class="info-item">📅 最終プレイ: <span id="lastPlayDate">-</span></div>
        <div class="info-item">⏱️ 本日セッション: <span id="sessionCount">0</span> 回</div>
    </div>

    <div class="graph-container">
        <div class="graph-title">📊 最近のプレイ履歴（スコア推移）</div>
        <div class="graph-wrap" id="historyGraph">
            </div>
    </div>

    <a href="index.html" class="back-link">← ホームに戻る</a>
</div>

<script>
    // === [重要] ローカルストレージからのデータ読み込み（リセットを絶対防止） ===
    let clickCount = parseInt(localStorage.getItem('myClickCount')) || 0;
    let todaySession = parseInt(localStorage.getItem('todaySessionCount')) || 0;
    let lastPlay = localStorage.getItem('last_play_date') || "未プレイ";
    let streak = parseInt(localStorage.getItem('click_streak')) || 1;
    let history = [];
    
    try {
        history = JSON.parse(localStorage.getItem('click_history')) || [];
    } catch(e) {
        history = [];
    }

    // 初期表示の設定
    document.getElementById('scoreNum').innerText = clickCount;
    document.getElementById('sessionCount').innerText = todaySession;
    document.getElementById('lastPlayDate').innerText = lastPlay;
    document.getElementById('streakBadge').innerText = `🔥 ${streak} 連撃目`;
    drawGraph();

    // メインクリック処理
    function clickGameMain() {
        clickCount++;
        streak++;
        
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getUTCDate()).padStart(2, '0');
        const todayStr = `${yyyy}/${mm}/${dd}`;

        if(lastPlay !== todayStr) {
            todaySession++;
            lastPlay = todayStr;
        }

        updateGameDisplay();
        saveGameHistory();
    }

    function updateGameDisplay() {
        document.getElementById('scoreNum').innerText = clickCount;
        document.getElementById('sessionCount').innerText = todaySession;
        document.getElementById('lastPlayDate').innerText = lastPlay;
        document.getElementById('streakBadge').innerText = `🔥 ${streak} 連撃目`;
    }

    // === バグ修正①：100回未満の更新でも【絶対に履歴をリセットしない】保存処理 ===
    function saveGameHistory() {
        localStorage.setItem('myClickCount', clickCount);
        localStorage.setItem('todaySessionCount', todaySession);
        localStorage.setItem('last_play_date', lastPlay);
        localStorage.setItem('click_streak', streak);

        // 毎回現在のスコアを正しく末尾に追加
        history.push({
            timestamp: new Date().getTime(),
            current_score: clickCount
        });

        // 50件を超えた場合のみ、古いものを削除（100回未満で消えるバグを完全修正）
        if (history.length > 50) {
            history.shift();
        }
        
        localStorage.setItem('click_history', JSON.stringify(history));
        drawGraph();
    }

    // === バグ修正③：7件などの少ない件数でも中央に綺麗に並ぶグラフ描画ロジック ===
    function drawGraph() {
        const graphWrap = document.getElementById('historyGraph');
        graphWrap.innerHTML = ""; // 初期化

        if (history.length === 0) {
            graphWrap.innerHTML = "<div style='color:#aaa; font-size:12px; width:100%; text-align:center; line-height:100px;'>履歴データがありません</div>";
            return;
        }

        // 表示する件数を直近の最大7件に制限（または全件からスライス）
        const displayData = history.slice(-7); 

        // グラフの最大高さを計算するための基準値を取得
        const scores = displayData.map(d => d.current_score);
        const maxScore = Math.max(...scores) || 1;
        const minScore = Math.min(...scores) || 0;
        const scoreRange = (maxScore - minScore) || 1;

        displayData.forEach(item => {
            const bar = document.createElement('div');
            bar.className = 'graph-bar';
            
            // 高さをパーセンテージで計算（最低でも10%の高さは確保して見やすくする）
            const heightPercent = ((item.current_score - minScore) / scoreRange) * 80 + 10;
            bar.style.height = `${heightPercent}%`;

            // バーの上にスコア数値を表示
            const label = document.createElement('span');
            label.className = 'graph-label';
            label.innerText = item.current_score;
            
            bar.appendChild(label);
            graphWrap.appendChild(bar);
        });
    }
</script>
</body>
</html>
